[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ctld-launcher"
dynamic = ["version"]
description = "GUI launcher/configurator for Hamlib's rigctld/rotctld"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "JF9SOM" }]
requires-python = ">=3.11"
keywords = ["amateur radio", "hamlib", "rigctld", "rotctld"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
]

dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
packaging = [
    "pyinstaller>=6.4",
    "Pillow>=10.0",  # icon generation (assets/generate_icons.py)
]

[project.scripts]
ctld-launcher = "ctld_launcher.main:main"

[project.urls]
Homepage = "https://github.com/JF9SOM/ctld-launcher"
Repository = "https://github.com/JF9SOM/ctld-launcher"
Issues = "https://github.com/JF9SOM/ctld-launcher/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/ctld_launcher/_version.py"

# --- Ruff (リンター・フォーマッター) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["src/ctld_launcher/_version.py"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # flake8-bugbear
    "SIM",               # flake8-simplify
    "ANN",               # type annotations
]
ignore = [
    "ANN401",  # Anyを許容
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

# --- mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true  # Hamlib等スタブなしライブラリ
exclude = ["tests/"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -v"

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["src/ctld_launcher/_version.py"]
